/* ================= POSICIÓN ================= */

let x = 100;


/* ================= NIVELES ================= */

let nivelActual = 1;


function iniciarNivel1() {

  nivelActual = 1;

  camaraRefugio.style.display =
    "block";

  camara.style.display = "none";

  x = 100;

  camaraX = 0;

function iniciarNivel2() {

  nivelActual = 2;

  camaraRefugio.style.display =
    "none";

  camara.style.display = "block";

  x = 100;

  camaraX = 0;

/* ================= ENEMIGOS ================= */

const enemigos =
  elementosEnemigos.map(
    function (el) {

      return {
        el: el,
        x: 0,
        vivo: false,
        direccion: -1
      };

/* los primeros 2 arrancan
   activos, como ya estaba */

enemigos[0].x = 420;
enemigos[0].vivo = true;
enemigos[0].el.style.display =
  "block";

enemigos[1].x = 500;
enemigos[1].vivo = true;
enemigos[1].el.style.display =
  "block";

const radioDeteccion = 300;

const velocidadEnemigo = 1.5;

let temporizadorSpawn = 0;

const intervaloSpawnBase = 240;


/* ================= JEFE ================= */

const jefe = {

  el: elementoJefe,

  x: 0,

  vivo: false,

  activado: false,

  vidaMax: 12,

  vida: 12,

  direccion: -1

};

const velocidadJefe = 2;

const distanciaAparicionJefe = 700;

const danioAtaqueJefe = 1;


function activarJefe(anchoMundoActual) {

  jefe.activado = true;

  jefe.vivo = true;

  jefe.vida = jefe.vidaMax;

  jefe.x =
    anchoMundoActual -
    jefe.el.offsetWidth -
    40;

  jefe.el.style.display =
    "block";

  jefeUI.style.display = "block";

  jefeBarraRelleno.style.width =
    "100%";

}


function jefeRecibeDanio(cantidad) {

  jefe.vida -= cantidad;

  if (jefe.vida < 0) {

    jefe.vida = 0;

  }

  jefeBarraRelleno.style.width =
    (jefe.vida / jefe.vidaMax) *
      100 +
    "%";

  if (jefe.vida <= 0) {

    jefe.vivo = false;

    jefe.el.style.display =
      "none";

    jefeUI.style.display = "none";

    juegoTerminado = true;

    nivelCompletado.style.display =
      "flex";

  }

}

const intervaloSpawnMin = 90;


function obtenerIntervaloSpawn() {

  return Math.max(
    intervaloSpawnMin,
    intervaloSpawnBase -
      (nivel - 1) * 15
  );

}


/* ================= VIDA ================= */

let vidas = 3;

let vidasMax = 3;

let invulnerableFrames = 0;

const framesInvulnerabilidad = 90;

let juegoTerminado = false;

let framesSinDanio = 0;

const framesParaRegenerar = 360;


function actualizarVidaUI() {

  let corazones = "";

  for (let i = 0; i < vidasMax; i++) {

    corazones +=
      i < vidas ? "❤️" : "🤍";

  }

  vidaUI.textContent = corazones;

}


function recibirDanio() {

  vidas -= 1;

  framesSinDanio = 0;

  invulnerableFrames =
    framesInvulnerabilidad;

  actualizarVidaUI();

  if (vidas <= 0) {

    juegoTerminado = true;

    jugador.style.opacity = "1";

    gameOver.style.display =
      "flex";

  }

}


reintentar.onclick =
function() {

};


/* ================= CÁMARA ================= */

let camaraX = 0;


/* ================= MOVIMIENTO ================= */

let moviendoIzquierda = false;

let moviendoDerecha = false;


/* ================= SALTO ================= */

let saltoY = 0;

let velocidadY = 0;

let saltando = false;

const gravedad = 0.8;

const fuerzaSalto = 15;

const umbralEsquiveSalto = 35;

let direccion = 1;


function intentarSaltar() {

  if (!saltando) {

    saltando = true;

    velocidadY = fuerzaSalto;

  }

}


/* ================= ESQUIVAR (DASH) ================= */

let esquivando = false;

let framesEsquivar = 0;

const duracionEsquivar = 9;

const velocidadEsquivar = 13;

let cooldownEsquivar = 0;

const cooldownEsquivarMax = 90;


function intentarEsquivar() {

  if (
    !esquivando &&
    cooldownEsquivar <= 0
  ) {

    esquivando = true;

    framesEsquivar =
      duracionEsquivar;

    cooldownEsquivar =
      cooldownEsquivarMax;

    invulnerableFrames = Math.max(
      invulnerableFrames,
      duracionEsquivar + 6
    );

  }

}


/* ================= ARMAS ================= */

const armas = [
  {
    nombre: "Glock",
    rango: 130,
    color: "red",
    nivelRequerido: 1,
    municionMax: 8
  },
  {
    nombre: "Escopeta",
    rango: 210,
    color: "#00c8ff",
    nivelRequerido: 3,
    municionMax: 5
  },
  {
    nombre: "Arma experimental",
    rango: 300,
    color: "#c400ff",
    nivelRequerido: 6,
    municionMax: 3
  }
];

let armaActualIndex = 0;

let municionActual = armas.map(
  function (arma) {

    return arma.municionMax;

  }
);

let recargando = false;

let framesRecarga = 0;

const duracionRecarga = 60;


function armaActual() {

  return armas[armaActualIndex];

}


function actualizarArmaUI() {

  armaActualUI.textContent =
    armaActual().nombre +
    " " +
    municionActual[
      armaActualIndex
    ] +
    "/" +
    armaActual().municionMax;

}


function cambiarArma() {

  let siguiente = armaActualIndex;

  for (
    let i = 0;
    i < armas.length;
    i++
  ) {

    siguiente =
      (siguiente + 1) %
      armas.length;

    if (
      nivel >=
      armas[siguiente]
        .nivelRequerido
    ) {

      armaActualIndex = siguiente;

      break;

    }

  }

  armaActualUI.textContent =
    armaActual().nombre;

  actualizarArmaUI();

}


function intentarRecargar() {

  if (
    !recargando &&
    municionActual[
      armaActualIndex
    ] <
      armaActual().municionMax
  ) {

    recargando = true;

    framesRecarga =
      duracionRecarga;

    armaActualUI.textContent =
      "Recargando...";

  }

}


/* ================= MUNICIÓN QUE SUELTAN LOS ENEMIGOS ================= */

let pickupsMunicion = [];

const probabilidadDropMunicion = 0.35;

const municionPorPickup = 2;

const duracionPickupMs = 10000;


function talVezSoltarMunicion(x) {

  if (
    Math.random() >
    probabilidadDropMunicion
  ) {

    return;

  }

  const elementoPickup =
    document.createElement("div");

  elementoPickup.className =
    "municionDrop";

  elementoPickup.textContent = "🔹";

  elementoPickup.style.left =
    x + "px";

  mundo.appendChild(
    elementoPickup
  );

  const pickup = {
    el: elementoPickup,
    x: x,
    recogido: false
  };

  pickupsMunicion.push(pickup);

  setTimeout(function () {

    if (!pickup.recogido) {

      pickup.el.remove();

      const indice =
        pickupsMunicion.indexOf(
          pickup
        );

      if (indice !== -1) {

        pickupsMunicion.splice(
          indice,
          1
        );

      }

    }

  }, duracionPickupMs);

}


/* ================= ATAQUE ================= */

let atacando = false;

let framesAtaque = 0;

let golpeAplicado = false;

const duracionAtaque = 12;

let enfriamientoAtaque = 0;

const cooldownBaseAtaque = 30;

const cooldownMinAtaque = 8;


function obtenerCooldownAtaque() {

  return Math.max(
    cooldownMinAtaque,
    cooldownBaseAtaque -
      (nivel - 1) * 3
  );

}


function intentarAtacar() {

  if (
    !atacando &&
    !recargando &&
    enfriamientoAtaque <= 0 &&
    municionActual[
      armaActualIndex
    ] > 0
  ) {

    atacando = true;

    framesAtaque = duracionAtaque;

    golpeAplicado = false;

    enfriamientoAtaque =
      obtenerCooldownAtaque();

    municionActual[
      armaActualIndex
    ] -= 1;

    actualizarArmaUI();

  }

}


/* ================= NIVEL Y EXPERIENCIA ================= */

let experiencia = 0;

let nivel = 1;

const killsPorNivel = 5;

const nivelUlti = 5;


function actualizarNivelUI() {

  nivelUI.textContent =
    "Nivel " + nivel;

  if (nivel >= nivelUlti) {

    botonUlti.style.display =
      "flex";

  }

  const nuevoMax = Math.min(
    6,
    3 + Math.floor((nivel - 1) / 2)
  );

  if (nuevoMax > vidasMax) {

    vidasMax = nuevoMax;

    vidas = Math.min(
      vidasMax,
      vidas + 1
    );

    actualizarVidaUI();

  }

}


function ganarExperiencia() {

  experiencia += 1;

  const nivelNuevo =
    1 +
    Math.floor(
      experiencia / killsPorNivel
    );

  if (nivelNuevo > nivel) {

    nivel = nivelNuevo;

    actualizarNivelUI();

  }

  const progresoNivelActual =
    experiencia % killsPorNivel;

  const fraccion =
    progresoNivelActual /
    killsPorNivel;

  const frame = Math.min(
    12,
    Math.floor(fraccion * 12) + 1
  );

  barraExpImg.src =
    "experiencia" + frame + ".png";

  if (nivel >= nivelUlti) {

    ganarCargaUlti();

  }

}


/* ================= ULTI ================= */

let ultiCarga = 0;

const ultiCargaPorKill = 25;


function ganarCargaUlti() {

  ultiCarga = Math.min(
    100,
    ultiCarga + ultiCargaPorKill
  );

  barraUltiRelleno.style.width =
    ultiCarga + "%";

  if (ultiCarga >= 100) {

    botonUlti.classList.add(
      "ultiLista"
    );

  }

}


/* ================= TECLADO ================= */

document.addEventListener(
  "keydown",
  function(event) {


    if (event.key === "ArrowRight") {

      x += 10;

      direccion = 1;

    }


    if (event.key === "ArrowLeft") {

      if (x > 0) {

        x -= 10;

        if (x < 0) {

          x = 0;

        }

        direccion = -1;

      }

    }


    if (event.key === "ArrowUp" || event.key === " ") {

      intentarSaltar();

    }

  }
);


/* ================= DERECHA ================= */

derecha.onpointerdown =
function(event) {

  event.preventDefault();

  moviendoDerecha = true;

  derecha.setPointerCapture(
    event.pointerId
  );

};


derecha.onpointerup =
function(event) {

  event.preventDefault();

  moviendoDerecha = false;

};


derecha.onpointercancel =
function() {

  moviendoDerecha = false;

};


/* ================= IZQUIERDA ================= */

izquierda.onpointerdown =
function(event) {

  event.preventDefault();

  moviendoIzquierda = true;

  izquierda.setPointerCapture(
    event.pointerId
  );

};


izquierda.onpointerup =
function(event) {

  event.preventDefault();

  moviendoIzquierda = false;

};


izquierda.onpointercancel =
function() {

  moviendoIzquierda = false;

};


/* ================= SALTAR ================= */

saltar.onpointerdown =
function(event) {

  event.preventDefault();

  intentarSaltar();

  saltar.setPointerCapture(
    event.pointerId
  );

};


esquivar.onpointerdown =
function(event) {

  event.preventDefault();

  intentarEsquivar();

  esquivar.setPointerCapture(
    event.pointerId
  );

};


/* ================= ATACAR ================= */

atacar.onpointerdown =
function(event) {

  event.preventDefault();

  intentarAtacar();

  atacar.setPointerCapture(
    event.pointerId
  );

};


botonCambiarArma.onpointerdown =
function(event) {

  event.preventDefault();

  cambiarArma();

  botonCambiarArma.setPointerCapture(
    event.pointerId
  );

};


botonRecargar.onpointerdown =
function(event) {

  event.preventDefault();

  intentarRecargar();

  botonRecargar.setPointerCapture(
    event.pointerId
  );

};


/* ================= ULTI ================= */

function usarUlti() {

  if (ultiCarga < 100) {

    return;

  }

  ultiCarga = 0;

  barraUltiRelleno.style.width =
    "0%";

  botonUlti.classList.remove(
    "ultiLista"
  );

  const cantidadRayos = 6;

  const anchoFranja =
    window.innerWidth /
    cantidadRayos;

  for (
    let i = 0;
    i < cantidadRayos;
    i++
  ) {

    const rayo =
      document.createElement(
        "div"
      );

    rayo.className = "rayoCielo";

    rayo.style.left =
      (anchoFranja * i +
        anchoFranja / 2) + "px";

    juego.appendChild(rayo);

    (function (elementoRayo) {

      setTimeout(function () {

        elementoRayo.remove();

      }, 500);

    })(rayo);

  }

  for (
    let i = 0;
    i < enemigos.length;
    i++
  ) {

    const e = enemigos[i];

    if (e.vivo) {

      e.vivo = false;

      e.el.style.display = "none";

      ganarExperiencia();

      talVezSoltarMunicion(e.x);

    }

  }

}


botonUlti.onpointerdown =
function(event) {

  event.preventDefault();

  usarUlti();

};


/* ================= SOLTAR ================= */

/* (el manejo de soltar ya lo hace cada botón individualmente
   con onpointerup/onpointercancel — un listener global acá
   cancelaba el movimiento al soltar CUALQUIER botón, incluido
   saltar o atacar) */


/* ================= CÁMARA ================= */

function actualizarJuego() {


  if (juegoTerminado) {

    requestAnimationFrame(
      actualizarJuego
    );

    return;

  }


  /* DERECHA */

  if (moviendoDerecha) {

    x += 3;

    direccion = 1;

  }


  /* IZQUIERDA */

  if (moviendoIzquierda) {

    if (x > 0) {

      x -= 3;

      if (x < 0) {

        x = 0;

      }

      direccion = -1;

    }

  }


  /* SALTO (física simple) */

  if (saltando) {

    saltoY += velocidadY;

    velocidadY -= gravedad;

    if (saltoY <= 0) {

      saltoY = 0;

      velocidadY = 0;

      saltando = false;

    }

  }


  /* ESQUIVAR (DASH) */

  if (cooldownEsquivar > 0) {

    cooldownEsquivar -= 1;

  }

  if (esquivando) {

    framesEsquivar -= 1;

    x += velocidadEsquivar * direccion;

    if (x < 0) {

      x = 0;

    }

    if (framesEsquivar % 2 === 0) {

      const rastro =
        document.createElement(
          "img"
        );

      rastro.src =
        "jugador1.png";

      rastro.className =
        "rastroEsquivar";

      rastro.style.left =
        jugador.style.left;

      rastro.style.transform =
        jugador.style.transform;

      juego.appendChild(rastro);

      (function (elementoRastro) {

        setTimeout(function () {

          elementoRastro.remove();

        }, 300);

      })(rastro);

    }

    if (framesEsquivar <= 0) {

      esquivando = false;

    }

  }


  /*
  MAPA MÁS GRANDE
  (varias copias del fondo
  una al lado de la otra)
  */

  const anchoTile =
    fondoMundo.offsetWidth;

  for (
    let i = 0;
    i < tilesMundo.length;
    i++
  ) {

    tilesMundo[i].style.left =
      (anchoTile * i) + "px";

  }

  const anchoMundo =
    anchoTile *
    tilesMundo.length;


  /* APARICIÓN GRADUAL (máximo 7, van reapareciendo, más rápido con el nivel) */

  temporizadorSpawn += 1;

  if (
    temporizadorSpawn >=
    obtenerIntervaloSpawn()
  ) {

    temporizadorSpawn = 0;

    for (
      let i = 0;
      i < enemigos.length;
      i++
    ) {

      if (!enemigos[i].vivo) {

        enemigos[i].vivo = true;

        enemigos[i].x =
          x +
          500 +
          Math.floor(
            Math.random() * 300
          );

        enemigos[i].el.style.display =
          "block";

        break;

      }

    }

  }


  /* ENEMIGOS PERSIGUEN AL JUGADOR (solo si está cerca) */

  for (
    let i = 0;
    i < enemigos.length;
    i++
  ) {

    const e = enemigos[i];

    if (!e.vivo) {

      continue;

    }

    if (
      Math.abs(x - e.x) <
      radioDeteccion
    ) {

      if (
        Math.abs(x - e.x) >
        velocidadEnemigo
      ) {

        if (x > e.x) {

          e.x += velocidadEnemigo;

          e.direccion = 1;

        } else {

          e.x -= velocidadEnemigo;

          e.direccion = -1;

        }

      }

    }

  }


  /* QUE NO SE AMONTONEN ENTRE ELLOS */

  for (
    let i = 0;
    i < enemigos.length;
    i++
  ) {

    if (!enemigos[i].vivo) {

      continue;

    }

    for (
      let j = i + 1;
      j < enemigos.length;
      j++
    ) {

      if (!enemigos[j].vivo) {

        continue;

      }

      const distancia =
        enemigos[j].x -
        enemigos[i].x;

      if (Math.abs(distancia) < 45) {

        if (distancia >= 0) {

          enemigos[i].x -= 1;

          enemigos[j].x += 1;

        } else {

          enemigos[i].x += 1;

          enemigos[j].x -= 1;

        }

      }

    }

  }


  /* QUE NO SE SALGAN DEL MAPA, Y APLICAR POSICIÓN/DIRECCIÓN */

  for (
    let i = 0;
    i < enemigos.length;
    i++
  ) {

    const e = enemigos[i];

    if (!e.vivo) {

      continue;

    }

    if (e.x < 0) {

      e.x = 0;

    }

    if (
      anchoMundo > 0 &&
      e.x >
        anchoMundo - e.el.offsetWidth
    ) {

      e.x =
        anchoMundo -
        e.el.offsetWidth;

    }

    e.el.style.left = e.x + "px";

    e.el.style.transform =
      "scaleX(" + e.direccion + ")";

  }


  /* RECARGA */

  if (recargando) {

    framesRecarga -= 1;

    if (framesRecarga <= 0) {

      recargando = false;

      municionActual[
        armaActualIndex
      ] =
        armaActual().municionMax;

      actualizarArmaUI();

    }

  }


  /* RECOGER MUNICIÓN TIRADA */

  for (
    let i = 0;
    i < pickupsMunicion.length;
    i++
  ) {

    const pickup =
      pickupsMunicion[i];

    if (
      !pickup.recogido &&
      Math.abs(x - pickup.x) < 40
    ) {

      pickup.recogido = true;

      pickup.el.remove();

      for (
        let j = 0;
        j < armas.length;
        j++
      ) {

        municionActual[j] =
          Math.min(
            armas[j].municionMax,
            municionActual[j] +
              municionPorPickup
          );

      }

      actualizarArmaUI();

    }

  }

  pickupsMunicion =
    pickupsMunicion.filter(
      function (p) {

        return !p.recogido;

      }
    );


  /* ATAQUE (rayo rojo) */

  if (enfriamientoAtaque > 0) {

    enfriamientoAtaque -= 1;

  }

  if (atacando) {

    framesAtaque -= 1;

    const rangoArmaActual =
      armaActual().rango;

    let inicioRayo;

    if (direccion === 1) {

      inicioRayo =
        (x - camaraX) +
        jugador.offsetWidth;

    } else {

      inicioRayo =
        (x - camaraX) -
        rangoArmaActual;

    }

    rayoAtaque.style.display =
      "block";

    rayoAtaque.style.left =
      inicioRayo + "px";

    rayoAtaque.style.width =
      rangoArmaActual + "px";

    rayoAtaque.style.background =
      armaActual().color;

    rayoAtaque.style.boxShadow =
      "0 0 10px 2px " +
      armaActual().color;

    rayoAtaque.style.transform =
      "translateY(-" +
      saltoY +
      "px)";

    if (!golpeAplicado) {

      golpeAplicado = true;

      let rangoIzq;
      let rangoDer;

      if (direccion === 1) {

        rangoIzq =
          x + jugador.offsetWidth;

        rangoDer =
          rangoIzq +
          rangoArmaActual;

      } else {

        rangoDer = x;

        rangoIzq =
          x - rangoArmaActual;

      }

      for (
        let i = 0;
        i < enemigos.length;
        i++
      ) {

        const e = enemigos[i];

        if (!e.vivo) {

          continue;

        }

        const centroEnemigo =
          e.x +
          e.el.offsetWidth / 2;

        if (
          centroEnemigo > rangoIzq &&
          centroEnemigo < rangoDer
        ) {

          e.vivo = false;

          e.el.style.display =
            "none";

          ganarExperiencia();

          talVezSoltarMunicion(e.x);

        }

      }

    }

    if (framesAtaque <= 0) {

      atacando = false;

      rayoAtaque.style.display =
        "none";

    }

  }


  /* DAÑO POR CONTACTO (superposición real, no distancia fija) */

  function seSuperponen(
    enemigo,
    enemigoX
  ) {

    const margen = 0.3;

    const anchoJugador =
      jugador.offsetWidth *
      (1 - margen);

    const anchoEnemigo =
      enemigo.offsetWidth *
      (1 - margen);

    const jugadorIzq =
      x +
      (jugador.offsetWidth -
        anchoJugador) /
        2;

    const jugadorDer =
      jugadorIzq + anchoJugador;

    const enemigoIzq =
      enemigoX +
      (enemigo.offsetWidth -
        anchoEnemigo) /
        2;

    const enemigoDer =
      enemigoIzq + anchoEnemigo;

    return (
      jugadorIzq < enemigoDer &&
      jugadorDer > enemigoIzq
    );

  }


  if (invulnerableFrames > 0) {

    invulnerableFrames -= 1;

    jugador.style.opacity =
      (Math.floor(
        invulnerableFrames / 5
      ) % 2 === 0)
        ? "0.3"
        : "1";

  } else {

    jugador.style.opacity = "1";

    const saltoSuficiente =
      saltoY >
      umbralEsquiveSalto;

    if (!saltoSuficiente) {

      for (
        let i = 0;
        i < enemigos.length;
        i++
      ) {

        const e = enemigos[i];

        if (
          e.vivo &&
          seSuperponen(e.el, e.x)
        ) {

          recibirDanio();

          break;

        }

      }

    }

  }


  /* REGENERACIÓN DE VIDA CON EL TIEMPO */

  if (vidas < vidasMax) {

    framesSinDanio += 1;

    if (
      framesSinDanio >=
      framesParaRegenerar
    ) {

      framesSinDanio = 0;

      vidas += 1;

      actualizarVidaUI();

    }

  }


  const camaraMax =
    Math.max(
      0,
      anchoMundo -
        window.innerWidth
    );


  /*
  CÁMARA SIGUE AL JUGADOR
  */

  camaraX =
    x -
    (window.innerWidth / 2);


  if (camaraX < 0) {

    camaraX = 0;

  }


  if (camaraX > camaraMax) {

    camaraX = camaraMax;

  }


  if (
    anchoMundo > 0 &&
    x > anchoMundo - jugador.offsetWidth
  ) {

    x =
      anchoMundo -
      jugador.offsetWidth;

  }


  /*
  MOVEMOS EL MUNDO
  */

  mundo.style.transform =
    "translateX(" +
    (-camaraX) +
    "px)";


  /*
  JUGADOR VISIBLE
  */

  jugador.style.left =
    (x - camaraX) +
    "px";

  jugador.style.transform =
    "translateY(-" +
    saltoY +
    "px) scaleX(" +
    direccion +
    ")";


  requestAnimationFrame(
    actualizarJuego
  );

}


/* ================= INICIAR ================= */

actualizarJuego();


/* ================= JUGAR ================= */

boton.onclick =
async function() {

  menu.style.display =
    "none";

  juego.style.display =
    "block";

  iniciarNivel2();


  /*
  INTENTAR PANTALLA COMPLETA
  (necesario en Chrome/Android
  para que el bloqueo de
  orientación funcione)
  */

  try {

    if (juego.requestFullscreen) {

      await juego.requestFullscreen();

    }

  } catch (error) {

    console.log(
      "Pantalla completa no disponible"
    );

  }


  /*
  INTENTAR PONER
  PANTALLA HORIZONTAL
  */

  if (
    screen.orientation &&
    screen.orientation.lock
  ) {

    screen.orientation
      .lock("landscape")
      .catch(
        function() {

          console.log(
            "El navegador no permite bloquear la orientación"
          );

        }
      );

  }

};


/* ================= SALIR ================= */

salir.onclick =
function() {

  alert(
    "¡Hasta la próxima!"
  );

};


/* ================= OPCIONES ================= */

opciones.onclick =
function() {

  alert(
    "¡No tiene opciones porque es una pre beta!"
  );

};


/* ================= PWA ================= */

if ("serviceWorker" in navigator) {

  window.addEventListener(
    "load",
    function () {

      navigator.serviceWorker
        .register("sw.js")
        .catch(function () {

          console.log(
            "Service worker no disponible"
          );

        });

    }
  );

}
