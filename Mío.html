<!DOCTYPE html>

 <html>
 <body>

   <div id = "menu">

<h1>bobo craf</h1>

<h2>el mejor juego</h2>

<p>esto es una pre beta </p>

<button id="jugar">JUGAR</button>
<button id="salir">SALIR</button>
  <button id="opciones">opciones</button>
   </div>

   <div id="pantalladejuego">
     <div id="mundo">
       
       
     <img src="IMG-20260814-WA0001.png" id=
       "jugador">
       <img src="enemigo1.png" id=
         "enemigo1">
   
       <img src="enemigo2.png"
         id= "enemigo2">
        </div>
     <div id="controles">
     <button id="izquierda">⬅️</button>
   <button id="derecha">➡️</button>
     </div>
    
   <style>
     html, body {
       margin: 0;
       padding: 0;
       overflow: hidden;
       width: 100%;
       height: 100%;
       }
     #jugador {
       width: 90px;
       position:absolute;
      top:300px;
     }
     #enemigo1 {
       width: 50px;
       position:absolute;
       left: 250px;
       top: 300px;
       }
     #enemigo2 {
       width: 50px;
       position:absolute;
       left: 200px;
       top: 300px;
  }
    #controles  {
      position:fixed ;
      bottom: 180px;
      left: 100px ;
      display: flex;
      gap: 50px;
      
    }
     #controles button{
       touch-action: none ;
       user-select: none ;
       -webkit-user-select: none;
       width: 60px;
       height: 60px;
       font-size: 40px;
       
       
     }
    
     
     
   </style>

<script>

const boton = document.getElementById("jugar");
  const botonsalir = document.getElementById("salir");
  const botonpciones = document.getElementById("opciones");
  const pantalladejuego = document.getElementById("pantalladejuego");
  const menu = 
    document.getElementById("menu")
  const jugador =
    document.getElementById("jugador")
  const izquierda =
    document.getElementById("izquierda")
  const derecha=
    document.getElementById("derecha")
  let x = 100;
  let camaraX = 0;
  const mundo = 
    document.getElementById("mundo");

  let moviendoizquierda = false
  let moviendoderecha= false

            document.addEventListener("keydown",function(event){
              
            if(event.key==="ArrowRight"){
              x = x + 10;
              jugador.style.left= x + "px";
              jugador.style.transform =
                "scaleX(1)";
            }
              
           if(event.key==="ArrowLeft" ){
             x = x - 10;
             jugador.style.left= x + "px";
             jugador.style.transform=
               "scaleX(-1)";
               
           }
            });
  derecha.onpointerdown = function(event){
  event.preventDefault();
  moviendoderecha = true;
};

derecha.onpointerup = function(event){
  event.preventDefault();
  moviendoderecha = false;
};

derecha.onpointercancel = function(){
  moviendoderecha = false;
};

izquierda.onpointerdown = function(event){
  event.preventDefault();
  moviendoizquierda = true;
};

izquierda.onpointerup = function(event){
  event.preventDefault();
  moviendoizquierda = false;
};

izquierda.onpointercancel = function(){
  moviendoizquierda = false;
};
  document.addEventListener("pointerup"
  ,function(){
    moviendoderecha = false;
    moviendoizquierda= false;

    });
  function moverjugador(){
    if(moviendoderecha){
      if(x < window.innerWidth - 60){
      x = x + 3;
      jugador.style.transform=
        "scaleX(1)";
    }
      }
    if(moviendoizquierda){
      if( x > 0){
      x = x -3;
      jugador.style.transform =
        "scaleX(-1)";
    }
      }
    jugador.style.left = x + "px";
    camaraX = - 200;
    if (camaraX < 0){
      camaraX = 0;
      }
    mundo.style.left = -camaraX +"px";
      
    requestAnimationFrame(moverjugador);
    
}

moverjugador();
              
              

pantalladejuego.style.display = "none";
  
console.log(boton);

  botonsalir.onclick = function(){
    alert("!asta la proxima");
  };

  botonpciones.onclick = function(){
    alert("!! no tiene opciones por que es una pre beta");
  };

boton.onclick = function(){
  menu.style.display = "none";
  pantalladejuego.style.display = 
    "block";
};

</script>
 </body>
 </html>
